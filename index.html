<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactez-nous — CM01</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --accent: #4f8cff;
    --accent-hover: #3d76e6;
    --success: #2ecc71;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px 0;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px 0;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input, textarea {
    width: 100%;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #10131a;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 90px; }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #444a58; cursor: not-allowed; }
  .msg {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.success {
    display: block;
    background: rgba(46, 204, 113, 0.12);
    border: 1px solid var(--success);
    color: var(--success);
  }
  .msg.error {
    display: block;
    background: rgba(255, 92, 92, 0.12);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .required { color: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <h1>Parlons de votre projet</h1>
  <p class="subtitle">Remplissez ce formulaire, nous revenons vers vous rapidement.</p>

  <form id="leadForm">
    <label for="first_name">Prénom <span class="required">*</span></label>
    <input type="text" id="first_name" name="first_name" required>

    <label for="last_name">Nom</label>
    <input type="text" id="last_name" name="last_name">

    <label for="email">Email <span class="required">*</span></label>
    <input type="email" id="email" name="email" required>

    <label for="company">Entreprise</label>
    <input type="text" id="company" name="company">

    <label for="phone">Téléphone</label>
    <input type="tel" id="phone" name="phone">

    <label for="message">Votre message</label>
    <textarea id="message" name="message" placeholder="Décrivez votre besoin..."></textarea>

    <button type="submit" id="submitBtn">Envoyer</button>

    <div class="msg" id="resultMsg"></div>
  </form>
</div>

<script>
  const API_URL = "http://127.0.0.1:5000/lead";

  const form = document.getElementById("leadForm");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("resultMsg");

  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    msg.className = "msg";
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Envoi en cours...";

    const payload = {
      first_name: document.getElementById("first_name").value.trim(),
      last_name: document.getElementById("last_name").value.trim(),
      email: document.getElementById("email").value.trim(),
      company: document.getElementById("company").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      message: document.getElementById("message").value.trim()
    };

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        if (data.status === "duplicate") {
          msg.className = "msg success";
          msg.textContent = "Nous avons déjà bien reçu votre demande, merci !";
        } else {
          msg.className = "msg success";
          msg.textContent = "Merci ! Votre demande a bien été envoyée, nous revenons vers vous rapidement.";
          form.reset();
        }
      } else {
        msg.className = "msg error";
        msg.textContent = "Erreur : " + (data.error || "veuillez vérifier vos informations.");
      }
    } catch (err) {
      msg.className = "msg error";
      msg.textContent = "Impossible de contacter le serveur. Vérifiez que le serveur CM01 est bien démarré.";
    }

    btn.disabled = false;
    btn.textContent = "Envoyer";
  });
</script>

</body>
</html>
